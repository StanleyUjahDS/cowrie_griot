name: griot_cowrie
description: "This is a chat app that operates in a decentralized manner"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  web3dart: ^3.0.3
  convert: ^3.1.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  overlay_support: ^2.1.0
  toastification: ^2.3.0
  local_auth: ^3.0.2
  font_awesome_flutter: ^11.0.0
  mobile_scanner: ^7.4.0
  wallet: ^0.0.13
  http: ^1.6.0
  crypto: ^3.0.7
  provider: ^6.1.5+1
  bip39_mnemonic: ^4.0.1
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  image: ^4.9.1
  objective_c: ^9.5.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.5.1
  cached_network_image: ^3.4.1
  google_mobile_ads: ^9.1.0
  flutter_svg: ^2.2.3
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/coins_logo/
    - assets/cowrie_images/
    - assets/chains/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/coins_logo/ic_launcher.png"
  adaptive_icon_foreground: "assets/coins_logo/ic_launcher.png"
  adaptive_icon_background: "#00211A"
  min_sdk_android: 21
